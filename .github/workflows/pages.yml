# Membangun EnviroWatch versi statis (+ snapshot Google Earth Engine) dan menerbitkannya ke GitHub Pages.
#
# Persiapan satu kali (lihat README, bagian "Deploy ke GitHub Pages"):
#   1. Settings → Pages → Source: "GitHub Actions".
#   2. Settings → Secrets and variables → Actions → New repository secret:
#        EE_SERVICE_ACCOUNT_KEY = isi file kunci JSON service account Earth Engine.
#      Tanpa secret ini situs tetap terbit, hanya tanpa lapisan Earth Engine.
name: Deploy EnviroWatch ke GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 */3 * * *'  # tiap 3 jam: berita & GBIF terbaru (snapshot Earth Engine dari cache bulanan)
  workflow_dispatch:
    inputs:
      force_ee:
        description: 'Hitung ulang snapshot Earth Engine (abaikan cache bulan ini)'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Pasang paket
        run: pip install -r requirements.txt

      - id: month
        run: echo "ym=$(TZ=Asia/Jakarta date +%Y-%m)" >> "$GITHUB_OUTPUT"

      # Snapshot Earth Engine dihitung sekali per bulan lalu dipakai ulang oleh build berikutnya.
      - uses: actions/cache/restore@v4
        with:
          path: .ee-cache
          key: ee-snapshot-${{ steps.month.outputs.ym }}-${{ github.run_id }}
          restore-keys: ee-snapshot-${{ steps.month.outputs.ym }}-

      - name: Bangun situs statis + snapshot Earth Engine
        env:
          EE_SERVICE_ACCOUNT_KEY: ${{ secrets.EE_SERVICE_ACCOUNT_KEY }}
          GOOGLE_CLOUD_PROJECT: ${{ vars.GOOGLE_CLOUD_PROJECT }}
          CDSE_INSTANCE_ID: ${{ vars.CDSE_INSTANCE_ID }}
          CDSE_LAYER: ${{ vars.CDSE_LAYER }}
          ENABLE_SCHEDULER: 'false'
          PYTHONIOENCODING: utf-8
        run: python scripts/build_static.py --with-ee auto --ee-cache .ee-cache ${{ inputs.force_ee && '--force-ee' || '' }}

      - name: Simpan cache snapshot bila dihitung ulang
        if: hashFiles('.ee-cache/.updated') != ''
        uses: actions/cache/save@v4
        with:
          path: .ee-cache
          key: ee-snapshot-${{ steps.month.outputs.ym }}-${{ github.run_id }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
